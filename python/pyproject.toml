[build-system]
requires = [
    "scikit-build-core >= 1.0",
    "cython >= 3.1",
    # Needed for build-time stub docstring extraction
    "libcst>=1.9.0; python_version >= '3.15'",
    "libcst>=1.8.6; python_version < '3.15'",
    "numpy>=2.0",
    "setuptools_scm[toml]>=8",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyarrow"
dynamic = ["version"]
requires-python = ">=3.11"
description = "Python library for Apache Arrow"
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = [
    "LICENSE.txt",
    "NOTICE.txt",
]
classifiers  = [
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Free Threading :: 2 - Beta',
]
maintainers = [
    {name = "Apache Arrow Developers", email = "dev@arrow.apache.org"}
]

[project.urls]
Homepage = "https://arrow.apache.org/"
Documentation = "https://arrow.apache.org/docs/python"
Repository = "https://github.com/apache/arrow"
Issues = "https://github.com/apache/arrow/issues"

[dependency-groups]
test = [
    'pytest',
    'hypothesis',
    'cffi',
    'pytz',
    'pandas'
]

[tool.numpydoc_validation]
checks = [
    "GL10",
    "PR01",
    "PR03",
    "PR04",
    "PR05",
    "PR10",
    "RT03",
    "YD01",
]
exclude = [
    '\._.*$',
]

[tool.scikit-build]
cmake.build-type = "Release"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["pyarrow/_generated_version.py", "cmake_modules/", "pyarrow-stubs/"]
wheel.packages = ["pyarrow"]
wheel.install-dir = "pyarrow"
# TODO(GH-32609): Remove this when stubfiles are complete
# Withhold the PEP 561 marker until the type stubs are complete. The .pyi files
# are also temporarily omitted from wheels, so type checkers don't rely on the
# incomplete stubs and break downstream users (GH-49831). py.typed is kept
# in-tree for CI type-checking.
wheel.exclude = ["pyarrow/py.typed"]

[tool.scikit-build.sdist.force-include]
"../LICENSE.txt" = "LICENSE.txt"
"../NOTICE.txt" = "NOTICE.txt"

[tool.scikit-build.cmake.define]
PYARROW_BUNDLE_ARROW_CPP = {env = "PYARROW_BUNDLE_ARROW_CPP", default = "OFF"}
PYARROW_BUNDLE_CYTHON_CPP = {env = "PYARROW_BUNDLE_CYTHON_CPP", default = "OFF"}
PYARROW_GENERATE_COVERAGE = {env = "PYARROW_GENERATE_COVERAGE", default = "OFF"}
PYARROW_CXXFLAGS = {env = "PYARROW_CXXFLAGS", default = ""}
PYARROW_REQUIRE_STUB_DOCSTRINGS = {env = "PYARROW_REQUIRE_STUB_DOCSTRINGS", default = "OFF"}

[tool.setuptools_scm]
root = '..'
version_file = 'pyarrow/_generated_version.py'
version_scheme = 'guess-next-dev'
git_describe_command = 'git describe --dirty --tags --long --match "apache-arrow-[0-9]*.*"'
fallback_version = '26.0.0a0'

# TODO: Enable type checking once stubs are merged
# The test suite is checked against the stubs: it calls the API with real
# values, so it validates the annotations. Test bodies are unannotated, hence
# check_untyped_defs. The library sources themselves are not checked yet.
[tool.mypy]
files = ["pyarrow-stubs", "pyarrow/tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/pyarrow-stubs"
check_untyped_defs = true
exclude = [
    "^benchmarks/",
    "^examples/",
    "^scripts/",
]

[tool.pyright]
pythonPlatform = "All"
pythonVersion = "3.11"
include = ["pyarrow-stubs", "pyarrow/tests"]
exclude = [
    "benchmarks",
    "examples",
    "scripts",
    "build",
]
stubPath = "pyarrow-stubs"
typeCheckingMode = "basic"
# The tests import optional dependencies as `x = None` on failure and then
# use them unguarded; every report of that idiom would be noise here.
reportOptionalMemberAccess = false

[tool.ty.environment]
extra-paths = ["pyarrow-stubs"]

[tool.ty.src]
include = ["pyarrow-stubs", "pyarrow/tests"]
exclude = [
    "benchmarks",
    "examples",
    "scripts",
]

# ruff formats and lints the generated stubs only; the pre-commit hooks and
# scripts/add_types_to_stubs.py run it. The stubs follow the typeshed
# conventions its flake8-pyi rules describe.
[tool.ruff]
include = ["pyarrow-stubs/**/*.pyi"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "PYI", "UP006", "UP007", "UP035", "UP037", "UP045"]
# Star imports mirror the sources; in a stub they re-export.
ignore = ["F403", "F405"]
