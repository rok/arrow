name: Python Wheel Debug Symbols

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/python_wheel_debug_symbols.yml'
      - 'ci/scripts/python_wheel_linux_debug_symbols_test.sh'
      - 'ci/scripts/python_wheel_xlinux_build.sh'
  pull_request:
    paths:
      - '.github/workflows/python_wheel_debug_symbols.yml'
      - 'ci/scripts/python_wheel_linux_debug_symbols_test.sh'
      - 'ci/scripts/python_wheel_xlinux_build.sh'

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: ${{ matrix.kind }} backtraces
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: manylinux
            build-service: python-wheel-manylinux-2-28
            test-image: python:3.11-bookworm
            install-gdb: apt-get update && apt-get install -y gdb
          - kind: musllinux
            build-service: python-wheel-musllinux-1-2
            test-image: python:3.11-alpine3.23
            install-gdb: apk add --no-cache bash gdb
    env:
      ARCHERY_DEBUG: 1
      PYTHON: '3.11'
      PYTHON_ABI_TAG: cp311
      ULIMIT_CORE: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Free up disk space
        run: ci/scripts/util_free_space.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Archery
        run: python -m pip install -e 'dev/archery[docker]'
      - name: Build this revision's wheel and debug-symbol bundle
        # Reuse the public wheel build image, but run the checked-out build script
        # against this revision's sources. No Crossbow submission or upload.
        run: |
          archery docker run --no-build \
            -e CMAKE_BUILD_PARALLEL_LEVEL=2 \
            ${{ matrix.build-service }}
      - name: Verify stripped and symbolized backtraces
        run: |
          mkdir -p verification
          docker run --rm \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --volume "${GITHUB_WORKSPACE}:/arrow" \
            ${{ matrix.test-image }} \
            sh -ec '${{ matrix.install-gdb }} &&
              python -m pip install numpy &&
              /arrow/ci/scripts/python_wheel_linux_debug_symbols_test.sh \
                /arrow/python/repaired_wheels/*.whl \
                /arrow/python/debug_symbols/*.tar.gz' \
            2>&1 | tee verification/backtraces.txt
      - name: Preserve wheels, symbols, and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbol-verification-${{ matrix.kind }}
          path: |
            python/repaired_wheels/*.whl
            python/debug_symbols/*.tar.gz
            verification/*.txt
